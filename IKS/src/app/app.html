<router-outlet></router-outlet>

<div *ngIf="showNotification" class="notification-toast">
  <div class="toast-icon">🚕</div>
  <div class="toast-content">
    <p class="toast-title">{{ notificationTitle }}</p>
    <p class="toast-message">{{ notificationMessage }}</p>
    <a *ngIf="notificationType === 'RIDE_FINISHED'" routerLink="/user-ride-history" class="toast-link">Rate ride →</a>
  </div>
  <button class="toast-close" (click)="showNotification = false">✕</button>
</div>

<!-- Panic Alert Modal - Only for ADMINISTRATOR -->
<app-panic-alert-modal
  *ngIf="userType === 'ADMINISTRATOR'"
  [alert]="currentPanicAlert"
  [isOpen]="showPanicModal"
  (close)="onClosePanicModal()"
  (markHandled)="onMarkPanicAsHandled($event)">
</app-panic-alert-modal>
