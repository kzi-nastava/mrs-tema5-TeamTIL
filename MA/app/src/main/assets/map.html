<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Popup za estimated time na ruti */
        .route-time-popup {
            background: #fffbe6;
            color: #55185D;
            font-weight: bold;
            border-radius: 8px;
            border: 2px solid #FFD524;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            padding: 6px 16px;
            font-size: 1.1em;
            text-align: center;
        }

        .leaflet-interactive {
            animation: dashMove 1s linear infinite;
        }

        @keyframes dashMove {
            to { stroke-dashoffset: -20; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div id="map"></div>

<script>
    var map = L.map('map').setView([45.2517, 19.8369], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
    }).addTo(map);

    var markers = [];
    var routeLayer = null;
    var routeMarkers = [];
    var panicMarkers = [];

    var activeIcon = L.icon({
        iconUrl: 'file:///android_asset/active_driver.png',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
    });

    var inactiveIcon = L.icon({
        iconUrl: 'file:///android_asset/inactive_driver.png',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
    });

    var startIcon = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
    });

    var destinationIcon = L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
    });

    function addMarker(lat, lng, title, available) {
        var icon = available ? activeIcon : inactiveIcon;
        var marker = L.marker([lat, lng], { icon: icon })
            .addTo(map)
            .bindPopup(`<strong>${title}</strong><br/>
                        Status: <span style="color:${available?'green':'red'}">
                        ${available?'Available':'Unavailable'}</span>`);
        markers.push(marker);
    }

    function clearMarkers() {
        markers.forEach(function(m) { map.removeLayer(m); });
        markers = [];
        routeMarkers.forEach(function(m) { map.removeLayer(m); });
        routeMarkers = [];
        if(routeLayer) {
            map.removeLayer(routeLayer);
            routeLayer = null;
        }
    }

    function drawRoute(coords, estimatedTime) {
        // Clear previous route elements
        routeMarkers.forEach(function(m) { map.removeLayer(m); });
        routeMarkers = [];
        if(routeLayer) map.removeLayer(routeLayer);

        // Draw the route line
        routeLayer = L.polyline(coords, { color: 'blue', weight: 5 }).addTo(map);

        // Add Start marker
        if(coords.length > 0) {
            var startMarker = L.marker(coords[0], { icon: startIcon })
                .addTo(map)
                .bindPopup('<strong>Start</strong>');
            routeMarkers.push(startMarker);
        }

        // Add Destination marker
        if(coords.length > 1) {
            var destMarker = L.marker(coords[coords.length - 1], { icon: destinationIcon })
                .addTo(map)
                .bindPopup('<strong>Destination</strong>');
            routeMarkers.push(destMarker);
        }

        // Add estimated time popup in the middle of the route
        if(estimatedTime && coords.length > 1){
            var midIdx = Math.floor(coords.length/2);
            var midPoint = coords[midIdx];
            L.popup({closeButton:false, autoClose:false, closeOnClick:false, className:'route-time-popup'})
                .setLatLng(midPoint)
                .setContent(`<b>Estimated time: ${estimatedTime}</b>`)
                .openOn(map);
        }

        map.fitBounds(routeLayer.getBounds(), { padding: [50,50] });
    }
    function markVehiclePanic(lat, lng, title) {
        // Remove previous panic markers
        panicMarkers.forEach(function(m) { map.removeLayer(m); });
        panicMarkers = [];

        // Create a red pulsing circle marker for the panicking vehicle
        var panicCircle = L.circleMarker([lat, lng], {
            radius: 18,
            color: '#FF0000',
            fillColor: '#FF0000',
            fillOpacity: 0.85,
            weight: 3
        }).addTo(map);
        panicCircle.bindPopup('<strong>🚨 PANIC: ' + title + '</strong>').openPopup();
        panicMarkers.push(panicCircle);

        // Pulse ring
        var pulseCircle = L.circleMarker([lat, lng], {
            radius: 30,
            color: '#FF0000',
            fillColor: 'transparent',
            fillOpacity: 0,
            weight: 2,
            opacity: 0.6
        }).addTo(map);
        panicMarkers.push(pulseCircle);

        map.setView([lat, lng], 15);
    }

    function clearPanicMarkers() {
        panicMarkers.forEach(function(m) { map.removeLayer(m); });
        panicMarkers = [];
    }

</script>
